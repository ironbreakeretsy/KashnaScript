<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kashna Script 12 — Clean Core</title>
<style>
:root{
  --roof:#101923;--roof2:#172635;--roofInk:#f7fafc;--roofMuted:#aab8c6;
  --bg:#e9e6df;--panel:#fff;--ink:#18212b;--muted:#6c7680;--line:#d9dee3;
  --blue:#2676ad;--blue2:#16527f;--violet:#7658a8;--danger:#a53939;--ok:#1e7a47;
  --scene:#f4d97d;--action:#dceefa;--character:#eadcf8;--parenthetical:#d8f2ea;
  --dialogue:#e0f2dd;--transition:#f8ded3;--note:#f6edb8;--shot:#dce7fb;
  --pageW:210mm;--pageH:297mm;--pageTop:22mm;--pageRight:20mm;--pageBottom:20mm;--pageLeft:25mm;
  --font:"Courier New",Courier,monospace;--fontSize:12pt;--lineHeight:1.15;
}
*{box-sizing:border-box}
html,body{height:100%;max-width:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.35 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{border:1px solid transparent;border-radius:10px;background:#fff;color:var(--ink);min-height:34px;padding:7px 10px;font-weight:750;cursor:pointer;transition:.14s}
button:hover{transform:translateY(-1px);box-shadow:0 5px 13px rgba(0,0,0,.11)}
button:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}
button.icon{width:34px;padding:0;display:grid;place-items:center;font-size:18px;line-height:1}
button.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}
button.danger{color:var(--danger);border-color:#e7b9b9;background:#fff7f7}
button.ghost{background:transparent;border-color:var(--line)}
input,select,textarea{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:8px 9px;width:100%;min-width:0}
input[type=checkbox]{width:auto;accent-color:var(--blue)}
[hidden]{display:none!important}

.app{height:100%;display:flex;flex-direction:column;min-width:0}
.roof{flex:0 0 auto;position:relative;z-index:50;color:var(--roofInk);background:linear-gradient(135deg,var(--roof),var(--roof2));border-bottom:1px solid rgba(255,255,255,.09);box-shadow:0 8px 28px rgba(15,24,34,.23);padding:max(8px,env(safe-area-inset-top)) 10px 8px}
.roof-main{display:flex;align-items:center;gap:7px;min-width:0}
.brand{display:flex;align-items:center;gap:8px;flex:0 0 auto;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#55a4db,#243f59);font-weight:900;box-shadow:0 7px 17px rgba(0,0,0,.28)}
.brand-copy strong{display:block;font-size:13px;letter-spacing:.02em}.brand-copy small{display:block;color:var(--roofMuted);font-size:9px}
.roof-group{display:flex;align-items:center;gap:4px;padding:4px;border:1px solid rgba(255,255,255,.13);border-radius:13px;background:rgba(255,255,255,.065);min-width:0}
.roof-group button,.roof-group label,.roof-group select,.roof-group input{min-height:34px;border-color:transparent;background:rgba(255,255,255,.08);color:var(--roofInk);box-shadow:none}
.roof-group button:hover,.roof-group label:hover{background:rgba(255,255,255,.15);transform:none}
.project-wrap{min-width:130px;max-width:220px;flex:1 1 170px}.project-wrap input{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segment button{color:var(--roofMuted)}.segment button.active{background:#fff;color:#152231;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.file-actions{gap:2px}.file-actions button{padding-inline:11px}.export-button{background:linear-gradient(135deg,#3189c5,#1a567e)!important;color:#fff!important}
.history-actions button:first-child{color:#d7edff}.history-actions button:nth-child(2){color:#eadcff}
.autosave-pill{display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--roofMuted);font-size:10px;font-weight:800;white-space:nowrap}.autosave-pill input{width:auto}
.zoom-readout{width:52px;text-align:center;color:var(--roofMuted);font-weight:850;font-size:10px}
.grow-spacer{flex:1 1 auto;min-width:2px}
.roof-more{position:relative}
.roof-popover{position:absolute;right:0;top:calc(100% + 7px);width:min(360px,90vw);padding:10px;border:1px solid #cfd7de;border-radius:13px;background:#fff;color:var(--ink);box-shadow:0 18px 50px rgba(0,0,0,.25);display:grid;gap:8px}
.roof-popover label{font-size:10px;font-weight:800;color:var(--muted)}
.roof-popover .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.workspace{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(250px,300px) minmax(330px,430px) minmax(420px,1fr);gap:1px;background:#b8b4ac}
.panel{min-width:0;min-height:0;background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.panel-head{flex:0 0 auto;min-height:48px;padding:8px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;background:linear-gradient(#fff,#f8fafb)}
.panel-head h2{font-size:13px;margin:0;margin-right:auto}.subtle{font-size:10px;color:var(--muted)}
.panel-body{min-height:0;overflow:auto}
.left-panel{background:#fbfcfd}.editor-panel{background:linear-gradient(145deg,#ede7df,#f6f2ec)}.preview-panel{background:#d2cec6}

.structure-tools{padding:9px;border-bottom:1px solid var(--line);display:grid;gap:7px;position:sticky;top:0;background:#fbfcfd;z-index:5}
.structure-tools .row{display:flex;gap:6px}.structure-tools select{flex:1}.structure-tools button{min-height:32px;padding:6px 8px}
.block-list{padding:9px;display:flex;flex-direction:column;gap:6px}
.block-card{display:grid;grid-template-columns:24px minmax(0,1fr) 26px;gap:7px;align-items:start;border:1px solid var(--typeAccent,#8b98a3);border-left-width:5px;border-radius:11px;padding:8px;background:var(--typeBg,#f7f8fa);box-shadow:0 2px 7px rgba(30,45,58,.07);cursor:pointer;touch-action:pan-y}
.block-card.selected{box-shadow:0 0 0 3px rgba(38,118,173,.2),0 8px 18px rgba(30,45,58,.12);border-color:var(--blue)}
.block-card.scene{--typeBg:var(--scene);--typeAccent:#c38a00}.block-card.shot{--typeBg:var(--shot);--typeAccent:#4d76b6}.block-card.action{--typeBg:var(--action);--typeAccent:#4c94c3}.block-card.character{--typeBg:var(--character);--typeAccent:#8b5ab0}.block-card.parenthetical{--typeBg:var(--parenthetical);--typeAccent:#42937c}.block-card.dialogue{--typeBg:var(--dialogue);--typeAccent:#4b9a55}.block-card.transition{--typeBg:var(--transition);--typeAccent:#cf6d4e}.block-card.note{--typeBg:var(--note);--typeAccent:#b68c00}
.drag-grip{color:var(--typeAccent);font-size:17px;text-align:center;cursor:grab;user-select:none}.block-copy{min-width:0}.block-type{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.055em;color:#48545f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.block-summary{margin-top:3px;font:10.5px/1.32 var(--font);white-space:pre-wrap;overflow-wrap:anywhere;max-height:42px;overflow:hidden}.delete-mini{border:0;background:transparent;color:var(--danger);min-height:24px;padding:0}
.empty-state{padding:32px 14px;text-align:center;color:var(--muted);font-size:12px}

.editor-panel .panel-head{background:linear-gradient(#f8f4ee,#ede4da)}
.editor-body{padding:11px;min-height:0;overflow:auto}
.type-row{display:grid;grid-template-columns:1fr auto;gap:7px;margin-bottom:8px}.type-row button{min-height:36px}
.format-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.format-row button{width:38px;height:36px;padding:0}.format-row select{width:auto;min-width:130px}
.editor-box{width:100%;min-height:360px;resize:vertical;border:1px solid #bbaea0;border-radius:13px;background:#fffefa;padding:18px;font:12pt/1.35 var(--font);white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 12px 28px rgba(74,54,34,.08)}
.editor-help{margin-top:7px;font-size:10px;color:var(--muted)}
.cover-form{display:grid;gap:9px}.cover-form textarea{min-height:76px;resize:vertical}.cover-preview-mini{aspect-ratio:210/297;border:1px solid #bcb5ab;border-radius:12px;background:#eee;overflow:hidden;position:relative;margin-bottom:11px}

.preview-toolbar{flex:0 0 auto;min-height:48px;padding:7px 9px;border-bottom:1px solid #aaa49b;background:#f9fafb;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.preview-toolbar button{min-height:32px;padding:5px 8px}.preview-toolbar .page-readout{margin-left:auto;font-size:10px;font-weight:850;color:#4f5963;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.preview-scroll{position:relative;min-height:0;flex:1;overflow:auto;background:var(--bg);touch-action:none;overscroll-behavior:contain}
.preview-canvas{position:relative;min-width:100%;min-height:100%;width:100%;height:auto;padding:24px 20px 90px}
.pages-stage{position:absolute;left:50%;top:24px;transform-origin:top center;width:max-content}
.pages{display:grid;gap:24px;justify-items:center;width:max-content}
.paper{width:var(--pageW);height:var(--pageH);background:#fff;position:relative;box-shadow:0 14px 25px -13px rgba(0,0,0,.38);overflow:hidden;color:#111;font:var(--fontSize)/var(--lineHeight) var(--font);direction:ltr}
.paper.rtl{direction:rtl}
.page-inner{position:absolute;inset:var(--pageTop) var(--pageRight) var(--pageBottom) var(--pageLeft);overflow:hidden}
.page-number{position:absolute;right:10mm;top:7mm;font:9pt Arial,sans-serif;color:#555}.rtl .page-number{right:auto;left:10mm}
.print-block{position:relative;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.print-block.scene,.print-block.shot{font-weight:700;margin-top:4mm;margin-bottom:2.2mm}.print-block.scene .scene-text{display:block}.scene-number{position:absolute;left:-16mm;width:12mm;text-align:center}.rtl .scene-number{left:auto;right:-16mm}
.print-block.action{width:100%;margin-bottom:2.15mm}.print-block.character{font-weight:700;text-transform:uppercase;margin-left:52mm;width:78mm;margin-top:2.4mm;margin-bottom:0}.print-block.parenthetical{margin-left:39mm;width:55mm;margin-bottom:0}.print-block.dialogue{margin-left:25mm;width:82mm;margin-bottom:2.2mm}.print-block.transition{text-align:right;font-weight:700;text-transform:uppercase;margin-top:3mm;margin-bottom:2mm}.print-block.note{background:#fff4b8;padding:2mm;border-radius:2mm;font:10pt/1.3 Arial,sans-serif;margin-bottom:2mm}.print-block.shot{font-weight:700}
.rtl .print-block.character{margin-left:0;margin-right:52mm}.rtl .print-block.parenthetical{margin-left:0;margin-right:39mm}.rtl .print-block.dialogue{margin-left:0;margin-right:25mm}.rtl .print-block.transition{text-align:left}
.cover-paper{background:var(--coverBg,#efefef);color:var(--coverInk,#111);text-align:center}.cover-layout{position:absolute;inset:0;padding:22mm}.cover-title{margin-top:38mm;font:700 26pt/1.15 var(--font);white-space:pre-wrap}.cover-subtitle{margin-top:7mm;font:16pt/1.25 var(--font);white-space:pre-wrap}.cover-byline{margin-top:14mm;font:12pt var(--font)}.cover-author{margin-top:4mm;font:700 16pt var(--font);white-space:pre-wrap}.cover-notes{margin:21mm auto 0;max-width:150mm;font:11pt/1.55 var(--font);white-space:pre-wrap}.cover-rights{margin-top:5mm;font:10pt/1.4 var(--font);white-space:pre-wrap}.cover-contact{position:absolute;left:20mm;right:20mm;bottom:16mm;text-align:left;font:9.5pt/1.4 var(--font);white-space:pre-wrap}.rtl .cover-contact{text-align:right}
.preview-selected{background:linear-gradient(90deg,rgba(38,118,173,.16),rgba(38,118,173,.02));box-shadow:inset 4px 0 0 var(--blue);border-radius:1.5mm}
.canvas-mode .preview-canvas{width:3200px;height:2300px;min-width:100%;min-height:100%;padding:0}.canvas-mode .pages-stage{left:300px;top:180px;transform-origin:0 0}
.settle{animation:settle .22s ease-out}@keyframes settle{0%{filter:brightness(.985);transform:translateY(1px)}100%{filter:none;transform:none}}

.modal-backdrop{position:fixed;inset:0;z-index:200;background:rgba(12,18,25,.52);display:flex;align-items:center;justify-content:center;padding:18px}
.modal{width:min(660px,96vw);max-height:min(760px,90vh);overflow:hidden;border-radius:16px;background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column}
.modal-head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}.modal-head h3{margin:0;margin-right:auto;font-size:15px}.modal-body{padding:14px;overflow:auto}.modal-actions{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;text-align:left}.choice strong{display:block}.choice small{display:block;color:var(--muted);margin-top:3px}.choice:hover{border-color:#7ca8ca;background:#f2f9ff}
.validation{padding:10px;border-radius:9px;background:#eff4f7;color:#495761;font-size:11px;margin-bottom:10px}.validation.ok{background:#e7f5eb;color:#176239}.validation.err{background:#ffe8e8;color:#852525}
.history-list,.draft-list{display:grid;gap:7px}.history-row,.draft-row{border:1px solid var(--line);border-radius:10px;padding:9px;display:flex;align-items:center;gap:8px}.history-row.current{border-color:var(--blue);background:#edf7ff}.history-copy,.draft-copy{flex:1;min-width:0}.history-copy strong,.draft-copy strong{display:block;font-size:11px}.history-copy small,.draft-copy small{display:block;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;z-index:300;right:18px;bottom:18px;max-width:min(430px,88vw);padding:10px 13px;border-radius:11px;background:#151d25;color:#fff;font-size:11px;box-shadow:0 12px 34px rgba(0,0,0,.28);opacity:0;transform:translateY(10px);pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:none}.toast.err{background:#8e2727}.toast.ok{background:#17643b}
.file-input{display:none}

@media(max-width:1240px){.roof-main{flex-wrap:wrap}.brand-copy small{display:none}.project-wrap{max-width:190px}.workspace{grid-template-columns:minmax(235px,28%) minmax(315px,34%) minmax(390px,38%)}}
@media(max-width:1180px){
  .roof{padding-bottom:7px}.roof-main{gap:5px}.roof-group{padding:3px}.roof-group button{font-size:10px;padding:6px 8px}.brand-copy{display:none}.project-wrap{max-width:none;flex:1 1 160px}
  .workspace{display:flex;overflow:hidden}.panel{flex:1 1 100%;display:none}.workspace.show-left .left-panel,.workspace.show-editor .editor-panel,.workspace.show-preview .preview-panel{display:flex}.mobile-switch{display:flex!important}
}
@media(min-width:1181px){.mobile-switch{display:none!important}}
@media(max-width:650px){.file-actions button span,.save-label,.history-label{display:none}.choice-grid{grid-template-columns:1fr}.roof-group select{max-width:115px}.autosave-pill span{display:none}}

#printRoot{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{height:auto;overflow:visible;background:#fff}
  .app,.modal-backdrop,.toast{display:none!important}
  #printRoot{display:block!important}
  #printRoot .paper{box-shadow:none;page-break-after:always;break-after:page;margin:0}
  #printRoot .paper:last-child{page-break-after:auto;break-after:auto}
  #printRoot .preview-selected{background:none;box-shadow:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="roof">
    <div class="roof-main">
      <div class="brand"><div class="brand-mark">K</div><div class="brand-copy"><strong>Kashna Script</strong><small>Clean Core 12</small></div></div>
      <div class="roof-group project-wrap"><input id="projectName" aria-label="Proje adı" value="İsimsiz Proje"></div>
      <div class="roof-group segment" aria-label="Belge görünümü"><button id="scriptViewBtn" class="active" data-i18n="script">Senaryo</button><button id="coverViewBtn" data-i18n="cover">Kapak</button></div>
      <div class="roof-group file-actions"><button id="importBtn"><span data-i18n="import">İçe Aktar</span></button><button id="exportBtn" class="export-button"><span data-i18n="export">Dışa Aktar</span></button></div>
      <div class="roof-group history-actions"><button id="undoBtn" title="Geri al">↶ <span class="history-label" data-i18n="undo">Geri</span></button><button id="redoBtn" title="İleri al">↷ <span class="history-label" data-i18n="redo">İleri</span></button><button id="historyBtn" title="Geçmiş">◷</button></div>
      <div class="roof-group"><button id="saveBtn">⌁ <span class="save-label" data-i18n="save">Kaydet</span></button><button id="draftsBtn" title="Taslaklar">▣</button><label class="autosave-pill"><input id="autosaveToggle" type="checkbox" checked><span data-i18n="autosave">Otomatik</span></label></div>
      <div class="grow-spacer"></div>
      <div class="roof-group"><button id="canvasBtn" title="Serbest tuval">⌖</button><button id="zoomOutBtn" class="icon" title="Küçült">−</button><div id="zoomReadout" class="zoom-readout">78%</div><button id="zoomInBtn" class="icon" title="Büyüt">+</button><button id="fitBtn" title="Sığdır">□</button></div>
      <div class="roof-group mobile-switch"><button data-panel="left">Yapı</button><button data-panel="editor">Düzenle</button><button data-panel="preview">Önizle</button></div>
      <div class="roof-group roof-more"><button id="moreBtn" class="icon" title="Ayarlar">⋯</button>
        <div id="morePopover" class="roof-popover" hidden>
          <div class="row"><div><label data-i18n="interfaceLanguage">Arayüz dili</label><select id="uiLanguage"></select></div><div><label data-i18n="documentLanguage">Belge dili</label><select id="documentLanguage"></select></div></div>
          <label><input id="sceneNumbersToggle" type="checkbox"> <span data-i18n="sceneNumbers">Sahne numaralarını göster</span></label>
          <label><input id="spellcheckToggle" type="checkbox" checked> <span data-i18n="spellcheck">Yazım denetimi</span></label>
          <button id="clearBtn" class="danger" data-i18n="clear">Projeyi Sil</button>
        </div>
      </div>
    </div>
  </header>

  <main id="workspace" class="workspace show-preview">
    <section class="panel left-panel">
      <div class="panel-head"><h2 data-i18n="structure">Yapı</h2><span id="sceneCount" class="subtle">0 sahne</span></div>
      <div class="panel-body">
        <div class="structure-tools">
          <div class="row"><select id="newBlockType"></select><button id="addBlockBtn" class="primary">+</button></div>
          <div class="row"><button id="validateBtn" class="ghost" data-i18n="validate">Biçimi Denetle</button><button id="renumberBtn" class="ghost" data-i18n="renumber">Sahneleri Say</button></div>
        </div>
        <div id="blockList" class="block-list"></div>
      </div>
    </section>

    <section class="panel editor-panel">
      <div class="panel-head"><h2 id="editorTitle" data-i18n="editor">Düzenleyici</h2><span id="saveStatus" class="subtle">Hazır</span></div>
      <div id="scriptEditorBody" class="editor-body">
        <div class="type-row"><select id="blockType"></select><button id="applyBlockBtn" class="primary" data-i18n="apply">Uygula</button></div>
        <div class="format-row"><button data-format="bold"><b>B</b></button><button data-format="italic"><i>I</i></button><button data-format="underline"><u>U</u></button><select id="fontFamily"><option>Courier New</option><option>Courier Prime</option><option>Arial</option><option>Times New Roman</option></select></div>
        <textarea id="blockEditor" class="editor-box" spellcheck="true"></textarea>
        <div class="editor-help" data-i18n="editorHelp">Seçili blok burada düzenlenir. Değişiklikler yazarken uygulanır.</div>
      </div>
      <div id="coverEditorBody" class="editor-body" hidden>
        <div id="coverMini" class="cover-preview-mini"></div>
        <div class="cover-form">
          <input id="coverTitle" placeholder="Başlık">
          <input id="coverSubtitle" placeholder="Alt başlık">
          <input id="coverByline" placeholder="yazan">
          <input id="coverAuthor" placeholder="Yazar">
          <textarea id="coverNotes" placeholder="Uyarlama / açıklama"></textarea>
          <textarea id="coverRights" placeholder="Haklar"></textarea>
          <textarea id="coverContact" placeholder="İletişim"></textarea>
          <div class="type-row"><input id="coverBg" type="color" value="#eeeeee"><input id="coverInk" type="color" value="#111111"></div>
        </div>
      </div>
    </section>

    <section class="panel preview-panel">
      <div class="preview-toolbar"><button id="prevPageBtn">‹</button><button id="nextPageBtn">›</button><button id="centerBtn" data-i18n="center">Ortala</button><span id="validationBadge" class="subtle"></span><div id="pageReadout" class="page-readout">1 / 1</div></div>
      <div id="previewScroll" class="preview-scroll"><div id="previewCanvas" class="preview-canvas"><div id="pagesStage" class="pages-stage"><div id="pages" class="pages"></div></div></div></div>
    </section>
  </main>
</div>

<input id="importInput" class="file-input" type="file" accept=".docx,.txt,.fountain,.kashna,.json">
<div id="modalRoot"></div>
<div id="toast" class="toast"></div>
<div id="printRoot"></div>

<script>
'use strict';
(() => {
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const TYPE_LABELS = {scene:'Sahne',shot:'Plan',action:'Aksiyon',character:'Karakter',parenthetical:'Parantez',dialogue:'Diyalog',transition:'Geçiş',note:'Not'};

let state = defaultState();
let history = [], historyIndex = -1, historyTimer = 0, autosaveTimer = 0, renderTimer = 0;
let renderedPages = [], pageEls = [], currentPage = 0;

function uid(){return 'b_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function clone(v){return structuredClone ? structuredClone(v) : JSON.parse(JSON.stringify(v))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s=''){return String(s).replace(/\r/g,'').replace(/[\u00a0\u202f]/g,' ').replace(/[ \t]+/g,' ').trim()}
function isUpperish(t){const letters=[...t].filter(c=>/\p{L}/u.test(c));return letters.length>0&&letters.filter(c=>c===c.toUpperCase()).length/letters.length>.84}
function toast(msg,kind=''){const el=$('#toast');el.textContent=msg;el.className='toast show '+kind;clearTimeout(el._t);el._t=setTimeout(()=>el.className='toast',2600)}
function debounceRender(){clearTimeout(renderTimer);renderTimer=setTimeout(renderPreview,40)}
function currentSelected(){return state.blocks.find(b=>b.id===state.selectedId)||null}
function setDirty(label='Değişiklik'){
  $('#saveStatus').textContent=state.settings.autosave?'Otomatik kayıt bekliyor':'Kaydedilmedi';
  clearTimeout(historyTimer);historyTimer=setTimeout(()=>pushHistory(label),260);
  if(state.settings.autosave){clearTimeout(autosaveTimer);autosaveTimer=setTimeout(()=>saveCurrent(true),700)}
}
function snapshot(){const s=clone(state);delete s.selectedId;return s}
function pushHistory(label='Değişiklik',force=false){
  const snap=snapshot(), key=JSON.stringify(snap);
  if(!force&&historyIndex>=0&&history[historyIndex]?.key===key)return;
  history=history.slice(0,historyIndex+1);history.push({key,snap,label,time:Date.now()});
  if(history.length>80)history.shift();historyIndex=history.length-1;updateHistoryButtons()
}
function updateHistoryButtons(){$('#undoBtn').disabled=historyIndex<=0;$('#redoBtn').disabled=historyIndex>=history.length-1}
function capturePreviewAnchor(){
  const sc=$('#previewScroll'), papers=$$('#pages .paper'); if(!papers.length)return {top:sc.scrollTop,left:sc.scrollLeft,page:0,offset:0};
  const sr=sc.getBoundingClientRect();let best=0,bestD=Infinity,offset=0;
  papers.forEach((p,i)=>{const r=p.getBoundingClientRect(),d=Math.abs(r.top-sr.top);if(d<bestD){bestD=d;best=i;offset=r.top-sr.top}});
  return {top:sc.scrollTop,left:sc.scrollLeft,page:best,offset}
}
function restorePreviewAnchor(a){requestAnimationFrame(()=>requestAnimationFrame(()=>{const sc=$('#previewScroll'),p=$$('#pages .paper')[Math.min(a.page,$$('#pages .paper').length-1)];if(p){const sr=sc.getBoundingClientRect(),r=p.getBoundingClientRect();sc.scrollTop+=r.top-sr.top-a.offset;sc.scrollLeft=a.left}else{sc.scrollTop=a.top;sc.scrollLeft=a.left}}))}
function applyHistory(index){if(index<0||index>=history.length)return;const a=capturePreviewAnchor();historyIndex=index;const keep={selectedId:state.selectedId,view:state.view,zoom:state.settings.zoom,canvasMode:state.settings.canvasMode};state=clone(history[index].snap);state.selectedId=state.blocks.some(b=>b.id===keep.selectedId)?keep.selectedId:state.blocks[0]?.id||null;state.view=keep.view;state.settings.zoom=keep.zoom;state.settings.canvasMode=keep.canvasMode;renderAll();restorePreviewAnchor(a);updateHistoryButtons()}

function initSelectors(){
  $('#uiLanguage').innerHTML=UI_LANGS.map(([v,n])=>`<option value="${v}">${esc(n)}</option>`).join('');
  $('#documentLanguage').innerHTML=DOC_LANGS.map(([v,n])=>`<option value="${v}">${esc(n)}</option>`).join('');
  const opts=TYPE_ORDER.map(t=>`<option value="${t}">${TYPE_LABELS[t]}</option>`).join('');$('#newBlockType').innerHTML=opts;$('#blockType').innerHTML=opts
}
function t(key){const l=state.settings.uiLanguage;return I18N[l]?.[key]||I18N.en[key]||I18N.tr[key]||key}
function applyI18n(){document.documentElement.lang=state.settings.uiLanguage;document.documentElement.dir=RTL_LANGS.has(state.settings.uiLanguage)?'rtl':'ltr';$$('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});$('#uiLanguage').value=state.settings.uiLanguage;$('#documentLanguage').value=state.settings.documentLanguage}
function applyDocumentLanguage(){const base=state.settings.documentLanguage.split('-')[0];const rtl=RTL_LANGS.has(base);$('#blockEditor').lang=state.settings.documentLanguage;$('#blockEditor').dir=rtl?'rtl':'ltr';$('#blockEditor').spellcheck=state.settings.spellcheck;document.documentElement.style.setProperty('--font',state.settings.fontFamily.includes(' ')?`"${state.settings.fontFamily}",monospace`:state.settings.fontFamily)}

function renderAll(){
  $('#projectName').value=state.projectName;$('#autosaveToggle').checked=state.settings.autosave;$('#sceneNumbersToggle').checked=state.settings.showSceneNumbers;$('#spellcheckToggle').checked=state.settings.spellcheck;$('#fontFamily').value=state.settings.fontFamily;
  $('#scriptViewBtn').classList.toggle('active',state.view==='script');$('#coverViewBtn').classList.toggle('active',state.view==='cover');$('#scriptEditorBody').hidden=state.view!=='script';$('#coverEditorBody').hidden=state.view!=='cover';
  renderBlocks();renderEditor();renderCoverForm();applyI18n();applyDocumentLanguage();renderPreview();updateHistoryButtons();updateZoomUI();updateSourceBadge()
}
function renderBlocks(){
  const list=$('#blockList'); if(!state.blocks.length){list.innerHTML=`<div class="empty-state">Henüz senaryo bloğu yok.</div>`;$('#sceneCount').textContent='0 sahne';return}
  let sceneNo=0;
  list.innerHTML=state.blocks.map((b,i)=>{if(b.type==='scene'||b.type==='shot')sceneNo++;return `<div class="block-card ${b.type} ${b.id===state.selectedId?'selected':''}" data-id="${b.id}" draggable="true"><div class="drag-grip">⋮⋮</div><div class="block-copy"><div class="block-type">${(b.type==='scene'||b.type==='shot')?sceneNo+'. ':''}${TYPE_LABELS[b.type]||b.type}</div><div class="block-summary">${esc(b.text)}</div></div><button class="delete-mini" data-delete="${b.id}" title="Sil">×</button></div>`}).join('');
  $('#sceneCount').textContent=`${state.blocks.filter(b=>b.type==='scene'||b.type==='shot').length} sahne`;
  $$('.block-card').forEach(el=>{el.addEventListener('click',e=>{if(e.target.dataset.delete)return;selectBlock(el.dataset.id)});el.addEventListener('dragstart',e=>{drag=el.dataset.id;e.dataTransfer.effectAllowed='move'});el.addEventListener('dragover',e=>e.preventDefault());el.addEventListener('drop',e=>{e.preventDefault();moveBlock(drag,el.dataset.id)});});
  $$('[data-delete]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();deleteBlock(btn.dataset.delete)})
}
function renderEditor(){const b=currentSelected();if(!b){$('#blockEditor').value='';$('#blockEditor').disabled=true;$('#blockType').disabled=true;return}$('#blockEditor').disabled=false;$('#blockType').disabled=false;$('#blockType').value=b.type;$('#blockEditor').value=b.text}
function renderCoverForm(){const c=state.cover;['title','subtitle','byline','author','notes','rights','contact'].forEach(k=>$('#cover'+k[0].toUpperCase()+k.slice(1)).value=c[k]||'');$('#coverBg').value=c.bg;$('#coverInk').value=c.ink;$('#coverMini').innerHTML=coverMarkup(true)}
function coverMarkup(mini=false){const c=state.cover;return `<div class="paper cover-paper ${isRTLDocument()?'rtl':''}" style="--coverBg:${esc(c.bg)};--coverInk:${esc(c.ink)};${mini?'width:100%;height:100%;transform:scale(1);font-size:4px':''}"><div class="cover-layout"><div class="cover-title">${esc(c.title)}</div><div class="cover-subtitle">${esc(c.subtitle)}</div><div class="cover-byline">${esc(c.byline)}</div><div class="cover-author">${esc(c.author)}</div><div class="cover-notes">${esc(c.notes)}</div><div class="cover-rights">${esc(c.rights)}</div><div class="cover-contact">${esc(c.contact)}</div></div></div>`}
function selectBlock(id){state.selectedId=id;renderBlocks();renderEditor();highlightSelectedInPreview()}

async function paginateBlocks(blocks){

    const words=b.text.split(/(\s+)/);let lo=1,hi=words.length,best=0;
    while(lo<=hi){const mid=(lo+hi)>>1,tmp={...b,text:words.slice(0,mid).join('').trim()};const h=measureBlock(tmp);if(h<=space){best=mid;lo=mid+1}else hi=mid-1}
    if(best<=0)return null;const a={...b,id:b.id+'_p'+Math.random().toString(36).slice(2,5),text:words.slice(0,best).join('').trim(),sourceId:b.id};const rest={...b,id:b.id+'_c'+Math.random().toString(36).slice(2,5),text:words.slice(best).join('').trim(),sourceId:b.id};return [a,rest]
  };

    let b={...blocks[i]};

    let group=[b];
    if((b.type==='scene'||b.type==='shot')&&blocks[i+1])group.push({...blocks[i+1]});
    if(b.type==='character'){

      const dIndex=i+(blocks[i+1]?.type==='parenthetical'?2:1);if(blocks[dIndex]?.type==='dialogue')group.push({...blocks[dIndex]});
    }

    let h=measureBlock(b);

}

  const issues=validateDocument();if(issues.some(x=>/sahne adayı|Karakterin altında|Diyalogdan önce/.test(x))&&!confirm(`Belgede ${issues.length} uyarı var. Yine de Word oluşturulsun mu?`))return;
  const body=(includeCover?coverWordXml():'')+(includeScript?state.blocks.map(b=>wordParagraph(b.text,b.type,{pageBreakBefore:b.hardPageBreakBefore})).join(''):'')+`<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1247" w:right="1134" w:bottom="1134" w:left="1417" w:header="720" w:footer="720"/><w:cols w:space="720"/></w:sectPr>`;
  const documentXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="${NS}"><w:body>${body}</w:body></w:document>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="${NS}"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Courier New" w:hAnsi="Courier New"/><w:sz w:val="24"/></w:rPr></w:rPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>`;
  const contentTypes=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/></Types>`;
  const rootRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/></Relationships>`;
  const docRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const core=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${xmlEscape(state.projectName)}</dc:title><dc:creator>${xmlEscape(state.cover.author)}</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString()}</dcterms:created></cp:coreProperties>`;
  const app=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>Kashna Script 12</Application></Properties>`;
  const zip=makeZip({'[Content_Types].xml':contentTypes,'_rels/.rels':rootRels,'word/document.xml':documentXml,'word/styles.xml':styles,'word/_rels/document.xml.rels':docRels,'docProps/core.xml':core,'docProps/app.xml':app});downloadBlob(new Blob([zip],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}),safeName(state.projectName)+'.docx');toast('Tek Word dosyası oluşturuldu.','ok')
}
async function preparePrint(includeCover=true,includeScript=true){
  const root=$('#printRoot');let html='';if(includeCover)html+=coverMarkup(false);if(includeScript){const pages=await paginateBlocks(state.blocks),sceneMap=getSceneNumberMap();html+=pages.map((arr,i)=>makePaper(i+1,arr.map(b=>blockHtml(b,sceneMap,false)).join(''))).join('')}root.innerHTML=html;setTimeout(()=>window.print(),80)
}
function exportProject(){downloadBlob(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),safeName(state.projectName)+'.kashna')}
function safeName(s){return (s||'Kashna_Script').replace(/[\\/:*?"<>|]+/g,'_').trim()||'Kashna_Script'}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1200)}

function showExport(){const issues=validateDocument();showModal('Dışa Aktar',`<div class="validation ${issues.length?'err':'ok'}">${issues.length?`${issues.length} biçim uyarısı var. Kritik sahne ve diyalog hatalarında çıktıyı kontrol et.`:'Belge temel denetimden geçti.'}</div><div class="choice-grid"><button class="choice" data-export="docx"><strong>Word (.docx)</strong><small>Kapak ve senaryo tek dosyada.</small></button><button class="choice" data-export="pdf"><strong>PDF / Yazdır</strong><small>Gerçek, seçilebilir metin. Tarayıcıdan PDF olarak kaydet.</small></button><button class="choice" data-export="project"><strong>Kashna Projesi</strong><small>Düzenlenebilir yedek dosya.</small></button><button class="choice" data-export="scriptdocx"><strong>Yalnız Senaryo Word</strong><small>Kapaksız tek DOCX.</small></button></div>`,[{label:'Kapat'}]);$$('[data-export]').forEach(b=>b.onclick=async()=>{closeModal();if(b.dataset.export==='docx')await exportDocx(true,true);if(b.dataset.export==='scriptdocx')await exportDocx(false,true);if(b.dataset.export==='pdf')await preparePrint(true,true);if(b.dataset.export==='project')exportProject()})}

function showModal(title,body,actions=[]){const root=$('#modalRoot');root.innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h3>${esc(title)}</h3><button data-close>×</button></div><div class="modal-body">${body}</div><div class="modal-actions">${actions.map((a,i)=>`<button data-action="${i}" class="${a.primary?'primary':''}">${esc(a.label)}</button>`).join('')}</div></div></div>`;root.querySelector('[data-close]').onclick=closeModal;root.querySelector('.modal-backdrop').onclick=e=>{if(e.target===e.currentTarget)closeModal()};actions.forEach((a,i)=>{root.querySelector(`[data-action="${i}"]`).onclick=()=>{a.onClick?.();if(a.close!==false)closeModal()}})}
function closeModal(){$('#modalRoot').innerHTML=''}
function showHistory(){showModal('Geçmiş',`<div class="history-list">${history.map((h,i)=>`<div class="history-row ${i===historyIndex?'current':''}"><div class="history-copy"><strong>${esc(h.label)}</strong><small>${new Date(h.time).toLocaleString()}</small></div><button data-history="${i}">Aç</button></div>`).reverse().join('')}</div>`,[{label:'Kapat'}]);$$('[data-history]').forEach(b=>b.onclick=()=>{applyHistory(Number(b.dataset.history));closeModal()})}

// ---------- persistence ----------
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('KashnaScript12',1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('projects'))db.createObjectStore('projects');if(!db.objectStoreNames.contains('drafts'))db.createObjectStore('drafts',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function dbPut(store,key,value){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite');const os=tx.objectStore(store);store==='drafts'?os.put(value):os.put(value,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function dbGet(store,key){const db=await openDB();return new Promise((resolve,reject)=>{const r=db.transaction(store).objectStore(store).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function dbAll(store){const db=await openDB();return new Promise((resolve,reject)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
async function dbDelete(store,key){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function saveCurrent(silent=false){let ok=false;try{await dbPut('projects','current',clone(state));ok=true}catch{}if(!ok)ok=safeLSSet('kashna12-current',JSON.stringify(state));if(ok){$('#saveStatus').textContent=state.settings.autosave?'Otomatik kaydedildi':'Kaydedildi';if(!silent)toast('Proje kaydedildi.','ok')}else{$('#saveStatus').textContent='Kayıt başarısız';if(!silent)toast('Tarayıcı kalıcı kayda izin vermedi. Proje dosyası indirerek yedekleyin.','err')}}
function safeLSGet(key){try{return localStorage.getItem(key)}catch{return null}}
function safeLSSet(key,value){try{localStorage.setItem(key,value);return true}catch{return false}}
function saveUiSettings(){safeLSSet('kashna12-ui',JSON.stringify({zoom:state.settings.zoom,canvasMode:state.settings.canvasMode,uiLanguage:state.settings.uiLanguage,documentLanguage:state.settings.documentLanguage,autosave:state.settings.autosave}))}
async function loadCurrent(){let saved=null;try{saved=await dbGet('projects','current')}catch{}if(!saved){try{saved=JSON.parse(safeLSGet('kashna12-current')||'null')}catch{}}if(saved&&saved.version===12)state=saved;let ui={};try{ui=JSON.parse(safeLSGet('kashna12-ui')||'{}')}catch{}if(Number.isFinite(ui.zoom))state.settings.zoom=Math.max(.35,Math.min(1.7,ui.zoom));if(typeof ui.canvasMode==='boolean')state.settings.canvasMode=ui.canvasMode;if(ui.uiLanguage)state.settings.uiLanguage=ui.uiLanguage;if(ui.documentLanguage)state.settings.documentLanguage=ui.documentLanguage;if(typeof ui.autosave==='boolean')state.settings.autosave=ui.autosave}
async function saveDraft(){const id='d_'+Date.now(),draft={id,name:state.projectName,time:Date.now(),state:clone(state)};await dbPut('drafts',id,draft);toast('Taslak kaydedildi.','ok')}
async function showDrafts(){const drafts=(await dbAll('drafts')).sort((a,b)=>b.time-a.time);showModal('Taslaklar',`<button id="newDraftBtn" class="primary" style="margin-bottom:10px">Mevcut sürümü taslak olarak sakla</button><div class="draft-list">${drafts.length?drafts.map(d=>`<div class="draft-row"><div class="draft-copy"><strong>${esc(d.name)}</strong><small>${new Date(d.time).toLocaleString()}</small></div><button data-open-draft="${d.id}">Aç</button><button data-delete-draft="${d.id}" class="danger">×</button></div>`).join(''):'Henüz taslak yok.'}</div>`,[{label:'Kapat'}]);$('#newDraftBtn').onclick=async()=>{await saveDraft();closeModal()};$$('[data-open-draft]').forEach(b=>b.onclick=()=>{const d=drafts.find(x=>x.id===b.dataset.openDraft);state=clone(d.state);pushHistory('Taslak açıldı',true);renderAll();closeModal()});$$('[data-delete-draft]').forEach(b=>b.onclick=async()=>{await dbDelete('drafts',b.dataset.deleteDraft);closeModal();showDrafts()})}

function bindEvents(){
  $('#projectName').oninput=e=>{state.projectName=e.target.value;setDirty('Proje adı')};
  $('#scriptViewBtn').onclick=()=>{state.view='script';renderAll()};$('#coverViewBtn').onclick=()=>{state.view='cover';renderAll()};
  $('#importBtn').onclick=()=>$('#importInput').click();$('#importInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(/\.docx$/i.test(f.name))await importDocx(f);else if(/\.(kashna|json)$/i.test(f.name)){const obj=JSON.parse(await f.text());if(obj.version!==12)throw new Error('Bu proje sürümü desteklenmiyor.');state=obj;history=[];historyIndex=-1;pushHistory('Proje içe aktarıldı',true);renderAll()}else importText(f,await f.text())}catch(err){console.error(err);toast('İçe aktarma başarısız: '+err.message,'err')}finally{e.target.value=''}};
  $('#exportBtn').onclick=showExport;$('#undoBtn').onclick=()=>applyHistory(historyIndex-1);$('#redoBtn').onclick=()=>applyHistory(historyIndex+1);$('#historyBtn').onclick=showHistory;$('#saveBtn').onclick=()=>saveCurrent(false);$('#draftsBtn').onclick=showDrafts;
  $('#autosaveToggle').onchange=e=>{state.settings.autosave=e.target.checked;saveUiSettings();setDirty('Otomatik kayıt ayarı');$('#saveStatus').textContent=e.target.checked?'Otomatik kayıt açık':'Otomatik kayıt kapalı'};
  $('#addBlockBtn').onclick=()=>addBlock($('#newBlockType').value);$('#applyBlockBtn').onclick=()=>{const b=currentSelected();if(!b)return;b.type=$('#blockType').value;b.text=$('#blockEditor').value;renderBlocks();debounceRender();setDirty('Blok düzenlendi')};
  $('#blockEditor').oninput=e=>{const b=currentSelected();if(!b)return;b.text=e.target.value;renderBlocks();debounceRender();setDirty('Metin düzenlendi')};$('#blockType').onchange=e=>{const b=currentSelected();if(!b)return;b.type=e.target.value;renderBlocks();debounceRender();setDirty('Blok türü')};
  $('#fontFamily').onchange=e=>{state.settings.fontFamily=e.target.value;applyDocumentLanguage();debounceRender();setDirty('Yazı tipi')};
  $$('.format-row [data-format]').forEach(btn=>btn.onclick=()=>{const ed=$('#blockEditor'),start=ed.selectionStart,end=ed.selectionEnd;if(start===end)return;const tag=btn.dataset.format==='bold'?'**':btn.dataset.format==='italic'?'*':'__';ed.setRangeText(tag+ed.value.slice(start,end)+tag,start,end,'select');ed.dispatchEvent(new Event('input'))});
  ['title','subtitle','byline','author','notes','rights','contact'].forEach(k=>{$('#cover'+k[0].toUpperCase()+k.slice(1)).oninput=e=>{state.cover[k]=e.target.value;renderCoverForm();debounceRender();setDirty('Kapak düzenlendi')}});$('#coverBg').oninput=e=>{state.cover.bg=e.target.value;renderCoverForm();debounceRender();setDirty('Kapak rengi')};$('#coverInk').oninput=e=>{state.cover.ink=e.target.value;renderCoverForm();debounceRender();setDirty('Kapak yazı rengi')};
  $('#zoomOutBtn').onclick=()=>changeZoom(-.08);$('#zoomInBtn').onclick=()=>changeZoom(.08);$('#fitBtn').onclick=fitPreview;$('#centerBtn').onclick=centerPreview;$('#canvasBtn').onclick=toggleCanvas;$('#prevPageBtn').onclick=()=>goPage(-1);$('#nextPageBtn').onclick=()=>goPage(1);$('#previewScroll').onscroll=()=>requestAnimationFrame(updatePageReadout);
  $('#moreBtn').onclick=e=>{e.stopPropagation();$('#morePopover').hidden=!$('#morePopover').hidden};document.addEventListener('click',e=>{if(!e.target.closest('.roof-more'))$('#morePopover').hidden=true});
  $('#uiLanguage').onchange=e=>{state.settings.uiLanguage=e.target.value;applyI18n();saveUiSettings();setDirty('Arayüz dili')};$('#documentLanguage').onchange=e=>{state.settings.documentLanguage=e.target.value;applyDocumentLanguage();debounceRender();saveUiSettings();setDirty('Belge dili')};$('#sceneNumbersToggle').onchange=e=>{state.settings.showSceneNumbers=e.target.checked;debounceRender();setDirty('Sahne numaraları')};$('#spellcheckToggle').onchange=e=>{state.settings.spellcheck=e.target.checked;applyDocumentLanguage();setDirty('Yazım denetimi')};
  $('#validateBtn').onclick=showValidation;$('#renumberBtn').onclick=()=>{updateSourceBadge();toast(`${state.blocks.filter(b=>b.type==='scene'||b.type==='shot').length} sahne bulundu.`,'ok')};
  $('#clearBtn').onclick=()=>{if(!confirm('Projeyi tamamen silmek istediğinize emin misiniz?'))return;state=defaultState();history=[];historyIndex=-1;pushHistory('Yeni proje',true);renderAll();saveCurrent(true);$('#morePopover').hidden=true};
  $$('.mobile-switch button').forEach(b=>b.onclick=()=>{$('#workspace').className='workspace show-'+b.dataset.panel});
  let pan=null;$('#previewScroll').addEventListener('pointerdown',e=>{if(!state.settings.canvasMode||e.button!==0)return;pan={x:e.clientX,y:e.clientY,left:$('#previewScroll').scrollLeft,top:$('#previewScroll').scrollTop};$('#previewScroll').setPointerCapture(e.pointerId)});$('#previewScroll').addEventListener('pointermove',e=>{if(!pan)return;$('#previewScroll').scrollLeft=pan.left-(e.clientX-pan.x);$('#previewScroll').scrollTop=pan.top-(e.clientY-pan.y)});$('#previewScroll').addEventListener('pointerup',()=>pan=null);$('#previewScroll').addEventListener('pointercancel',()=>pan=null);
  window.addEventListener('resize',()=>{if(innerWidth>1180)$('#workspace').className='workspace';applyZoom()});
}

(async function init(){initSelectors();await loadCurrent();if(!state.blocks.length){state.blocks=[{id:uid(),type:'scene',text:'İÇ. MEKÂN - GÜNDÜZ',hardPageBreakBefore:false},{id:uid(),type:'action',text:'Sahnenizi buraya yazın.',hardPageBreakBefore:false}];state.selectedId=state.blocks[0].id}pushHistory('Başlangıç',true);bindEvents();renderAll();if(innerWidth<=1180)$('#workspace').className='workspace show-preview';setTimeout(fitPreview,120)})();
})();
</script>
</body>
</html>
